<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weingut Machmer – Weininfo</title><style>:root{--wine:#651f2b;--gold:#b79a62;--bg:#f7f4ef;--text:#2d2926}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.card{max-width:520px;margin:0 auto;min-height:100vh;background:#fff}.head{background:var(--wine);color:#fff;padding:28px 24px 30px;text-align:center}.brand{letter-spacing:3px;font-size:12px;font-weight:700}.wine{font-family:Georgia,serif;font-size:32px;line-height:1.1;margin:18px 0 8px}.meta{opacity:.9;font-size:14px}.price{font-size:28px;font-weight:700;margin-top:20px}.body{padding:24px}.label{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-top:24px}.text{font-size:16px;line-height:1.55}.pill{display:inline-block;background:#f2ece6;border-radius:20px;padding:8px 12px;margin:5px 4px 0 0;font-size:13px}.footer{text-align:center;border-top:1px solid #eee;padding:20px;font-size:10px;letter-spacing:2px;color:#777}select{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:15px}</style></head><body><main class="card"><header class="head"><div class="brand">WEINGUT MACHMER · RHEINHESSEN</div><div id="name" class="wine">Weininfo</div><div id="meta" class="meta"></div><div id="price" class="price"></div></header><section class="body"><select id="wineSelect"></select><div class="label">Über den Wein</div><div id="desc" class="text"></div><div class="label">Aromen</div><div id="aromas"></div><div class="label">Passt besonders gut zu</div><div id="food" class="text"></div><div class="label">Unser Tipp</div><div id="tip" class="text"></div></section><footer class="footer">WEINGUT MACHMER · BIO · VEGAN</footer></main><script>const wines={"riesling-trocken-edition-gm-2024":{name:"Riesling trocken – Edition G&M",meta:"2024 · trocken · Riesling",price:"9,40 €",desc:"Frischer, charaktervoller Riesling mit klarer Frucht und lebendiger Säure.",aromas:["Zitrus","Apfel","Pfirsich"],food:"Fisch, Geflügel, leichte Küche und Salate.",tip:"Gut gekühlt servieren und als vielseitigen Essensbegleiter genießen."},"grauburgunder-2025":{name:"Grauburgunder trocken – Edition G&M",meta:"2025 · trocken · Grauburgunder",price:"9,40 €",desc:"Harmonischer Grauburgunder mit angenehmer Frucht und ausgewogener Struktur.",aromas:["Birne","Apfel","Nuss"],food:"Pasta, Geflügel, Fisch und herzhafte vegetarische Gerichte.",tip:"Bei etwa 8–10 °C servieren."}};const p=new URLSearchParams(location.search),id=p.get("wein")||"riesling-trocken-edition-gm-2024",w=wines[id]||wines["riesling-trocken-edition-gm-2024"];document.getElementById("name").textContent=w.name;document.getElementById("meta").textContent=w.meta;document.getElementById("price").textContent=w.price;document.getElementById("desc").textContent=w.desc;document.getElementById("food").textContent=w.food;document.getElementById("tip").textContent=w.tip;document.getElementById("aromas").innerHTML=w.aromas.map(x=>"<span class='pill'>"+x+"</span>").join("");const s=document.getElementById("wineSelect");Object.entries(wines).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.name;s.appendChild(o)});s.value=id;s.onchange=()=>location.search="?wein="+s.value;</script></body></html>
